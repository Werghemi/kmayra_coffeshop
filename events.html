<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kmayra Coffee Shop — Weekly Events" />
  <title>Weekly Events — Kmayra Coffee Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="arabic-bg" aria-hidden="true">العذر القهوة... و القصد شوفتك</div>

  <main class="page">

    <!-- Page Header -->
    <header class="page-header animate-in">
      <a href="index.html" class="back-btn">← Back to Home</a>
      <h1 class="page-title">Weekly Events</h1>
      <p class="page-subtitle">Come share a moment with us</p>
    </header>

    <div class="events-body">
      <div class="events-grid">

        <!--
        EVENT CARDS ARE CURRENTLY HIDDEN.
        To show them: cut everything between the opening and
        closing comment tags of each card and paste it outside.

        HOW TO EDIT EACH WEEK:
        - event-day-name  : short day (Mon, Tue, Wed...)
        - event-day-num   : day number (e.g. 12)
        - strong tag      : full date (e.g. Monday, June 9)
        - span tag        : time (e.g. 7:00 PM)
        - event-tag       : short category label
        - event-title     : event name
        - event-desc      : description paragraph
        - event-icon      : emoji in card footer

        == EVENT CARD 1 ==
        <article class="event-card animate-in delay-1">
          <div class="event-card-accent"></div>
          <div class="event-card-body">
            <div class="event-meta">
              <div class="event-day-badge">
                <span class="event-day-name">FRI</span>
                <span class="event-day-num">6</span>
              </div>
              <div class="event-date-text">
                <strong>Friday, June 6</strong>
                <span>Starting at 7:00 PM</span>
              </div>
            </div>
            <h2 class="event-title">Open Mic Night</h2>
            <p class="event-desc">
              Bring your voice, your poetry, or your guitar. Every Friday evening
              we open our stage to local talent. All are welcome to perform or enjoy.
            </p>
          </div>
          <div class="event-card-footer">
            <span class="event-tag">Music &amp; Arts</span>
            <span class="event-icon">🎶</span>
          </div>
        </article>

        == EVENT CARD 2 ==
        <article class="event-card animate-in delay-2">
          <div class="event-card-accent"></div>
          <div class="event-card-body">
            <div class="event-meta">
              <div class="event-day-badge">
                <span class="event-day-name">SAT</span>
                <span class="event-day-num">7</span>
              </div>
              <div class="event-date-text">
                <strong>Saturday, June 7</strong>
                <span>Starting at 5:00 PM</span>
              </div>
            </div>
            <h2 class="event-title">Board Games Evening</h2>
            <p class="event-desc">
              Gather your friends over a cup of something delicious. Our board games
              corner will be fully set up. Just show up!
            </p>
          </div>
          <div class="event-card-footer">
            <span class="event-tag">Social &amp; Games</span>
            <span class="event-icon">🎲</span>
          </div>
        </article>
        -->

      </div><!-- /.events-grid -->

      <!-- Summer teaser note -->
      <div class="summer-note animate-in delay-2">
        <span class="summer-note-emoji">☀️🌊✨</span>
        <p class="summer-note-text">Too much fun waiting for you this summer!</p>
        <p class="summer-note-sub">Stay tuned — big things are coming ☕</p>
      </div>

    </div><!-- /.events-body -->

    <!-- Footer -->
    <footer class="page-footer animate-in delay-3">
      <p class="footer-made">
        Made with <span class="footer-heart">♥</span> by <span>Haroun Werghemmi</span>
      </p>
    </footer>

  </main>

</body>
</html>
