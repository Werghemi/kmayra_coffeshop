<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kmayra Coffee Shop — A cozy, modern café experience." />
  <title>Kmayra Coffee Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Arabic Calligraphy Background -->
  <div class="arabic-bg" aria-hidden="true">العذر القهوة... و القصد شوفتك</div>

  <main class="page">

    <!-- Hero -->
    <section class="hero">

      <!-- Steam animation -->
      <div class="steam-wrapper" aria-hidden="true">
        <div class="steam"></div>
        <div class="steam"></div>
        <div class="steam"></div>
      </div>

      <!-- Logo -->
      <div class="logo-container animate-in">
        <span class="logo-main">Kmayra</span>
        <span class="logo-sub">Coffee&nbsp;Shop</span>
      </div>

      <!-- Ornament divider -->
      <div class="ornament animate-in delay-1" aria-hidden="true">
        <span class="ornament-line"></span>
        <span class="ornament-icon">☕</span>
        <span class="ornament-line"></span>
      </div>

      <!-- Navigation Buttons -->
      <nav class="nav-links" aria-label="Main navigation">

        <a href="menu.html" class="nav-btn nav-btn--primary animate-in delay-2">
          <span class="btn-label">Kmayra Menu</span>
          <span class="btn-icon" aria-hidden="true">☕</span>
        </a>

        <a href="https://www.instagram.com/kmayra_coffeeshop/"
           target="_blank" rel="noopener noreferrer"
           class="nav-btn nav-btn--secondary animate-in delay-3">
          <span class="btn-label">Instagram</span>
          <span class="btn-icon" aria-hidden="true">📸</span>
        </a>

        <a href="https://www.tiktok.com/@kmayra_coffeeshop?_r=1&_t=ZS-961almNlycs"
           target="_blank" rel="noopener noreferrer"
           class="nav-btn nav-btn--secondary animate-in delay-4">
          <span class="btn-label">TikTok</span>
          <span class="btn-icon" aria-hidden="true">🎵</span>
        </a>

        <a href="https://www.google.com/maps/place/Kmayra+coffee+shop/@36.0304541,10.5072787,16.99z/data=!4m6!3m5!1s0x12fd85007e042441:0x80313b62e541119f!8m2!3d36.030453!4d10.5098625!16s%2Fg%2F11xp0xjvp0?entry=ttu&g_ep=EgoyMDI2MDQyOS4wIKXMDSoASAFQAw%3D%3D"
           target="_blank" rel="noopener noreferrer"
           class="nav-btn nav-btn--accent animate-in delay-5">
          <span class="btn-label">Rate our Service</span>
          <span class="btn-icon" aria-hidden="true">⭐</span>
        </a>

        <a href="events.html" class="nav-btn nav-btn--secondary animate-in delay-6">
          <span class="btn-label">Weekly Events</span>
          <span class="btn-icon" aria-hidden="true">🎉</span>
        </a>

      </nav>

      <!-- Footer tagline -->
      <p class="footer-tagline animate-in delay-6">
        العذر القهوة... و القصد شوفتك
      </p>

    </section>
  </main>

</body>
</html>
